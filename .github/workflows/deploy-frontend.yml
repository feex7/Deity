name: 部署前端到 GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'my-blog/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: my-blog
        run: npm install

      - name: 构建前端
        working-directory: my-blog
        env:
          VITE_API_URL: ${{ secrets.VITE_RENDER_BACKEND_URL || 'https://blog-backend-xxxx.onrender.com/api' }}
          VITE_BASE: /Deity/
        run: npm run build

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: my-blog/dist
          publish_branch: gh-pages