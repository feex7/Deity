name: 部署前端到 GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'my-blog/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: my-blog/package-lock.json

      - name: 安装依赖
        working-directory: my-blog
        run: npm ci

      - name: 构建前端
        working-directory: my-blog
        env:
          VITE_API_URL: ${{ secrets.VITE_RENDER_BACKEND_URL || 'https://blog-backend-xxxx.onrender.com/api' }}
          VITE_BASE: /Deity/
        run: npm run build

      - name: 设置 Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-blog/dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4